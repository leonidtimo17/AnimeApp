<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f0f12">
  <title>AnimeApp</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/player.css">
</head>
<body>
  <div id="app">
    <main id="view"></main>
    <nav id="tabs" data-i18n-aria="navigation.label">
      <button data-tab="home"><i class="fa">&#xf015;</i><span data-i18n="navigation.home">Главная</span></button>
      <button data-tab="recs"><i class="fa">&#xe2ca;</i><span data-i18n="navigation.recs">Для вас</span></button>
      <button data-tab="catalog"><i class="fa">&#xf009;</i><span data-i18n="navigation.catalog">Каталог</span></button>
      <button data-tab="search"><i class="fa">&#xf002;</i><span data-i18n="navigation.search">Поиск</span></button>
      <button data-tab="library"><i class="fa">&#xf02e;</i><span data-i18n="navigation.library">Моё</span></button>
      <button data-tab="account" id="tabShiki"><i class="fa">&#xf0c1;</i><span>Shikimori</span></button>
    </nav>
  </div>
  <div id="player" hidden></div>
  <div id="sheet" hidden></div>
  <div id="toast" hidden></div>
  <div id="offline" role="status" hidden data-i18n="network.offline_banner">Нет подключения к интернету — показываем сохранённое</div>
  <script src="vendor/hls.min.js" defer></script>
  <script type="module" src="js/app/bootstrap.js"></script>
</body>
</html>
